name: Integration-test-qubership-open-telemetry-collector
run-name: "Ref: ${{ github.ref_name }}. On ${{ github.event_name }}"

on:
  workflow_dispatch: {}
  pull_request:
    branches:
    - '**'

permissions: {}

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  kind_name: kind-cluster
  kind_version: v0.27.0
  cassandra_namespace: cassandra
  jaeger_namespace: jaeger
  collector_namespace: monitoring
  max_attempts: 30
  delay: 10

jobs:
  changes:
    name: Integration changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Detect integration-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            source:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/**'
              - '!.markdownlintignore'
            workflow:
              - '.github/workflows/build.yml'
              - '.github/workflows/integration_test.yaml'

  integration:
    name: Run integration tests
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.source == 'true' || needs.changes.outputs.workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code otel-collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: qubership-open-telemetry-collector
          persist-credentials: false

      - name: Checkout jaeger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'Netcracker/qubership-jaeger'
          ref: 'main'
          path: qubership-jaeger
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: qubership-open-telemetry-collector/tools/go.mod
          cache-dependency-path: qubership-open-telemetry-collector/tools/go.sum

      - name: Install telemetrygen
        working-directory: qubership-open-telemetry-collector/tools
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          telemetrygen_version="$(go list -m -f '{{.Version}}' go.opentelemetry.io/collector/cmd/builder)"
          go install "github.com/open-telemetry/opentelemetry-collector-contrib/cmd/telemetrygen@${telemetrygen_version}"
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Set up Kind
        run: |
          curl -sLo ./kind https://kind.sigs.k8s.io/dl/${{ env.kind_version }}/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/
          kind delete cluster --name ${{ env.kind_name }}
          cat <<EOF | kind create cluster --config=-
          kind: Cluster
          name:  ${{ env.kind_name }}
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          EOF
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Build and load qubership-open-telemetry-collector
        run: |
                docker build ./qubership-open-telemetry-collector/ -t qubership-open-telemetry-collector
                kind --name ${{ env.kind_name }} load docker-image qubership-open-telemetry-collector:latest

      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm upgrade --install cert-manager jetstack/cert-manager --namespace cert-manager \
            --create-namespace --version v1.16.3 --set prometheus.enabled=true   --set crds.enabled=true

      - name: Install k8ssandra operator
        run: |
          helm repo add k8ssandra https://helm.k8ssandra.io/stable --force-update
          helm upgrade --install k8ssandra-operator k8ssandra/k8ssandra-operator -n ${{ env.cassandra_namespace }} --create-namespace --version 1.29.0
          kubectl wait --for=condition=Ready pod --all -n ${{ env.cassandra_namespace }} --timeout=120s

      - name: Deploy k8ssandra cluster
        run: |
              cat <<EOF | kubectl apply -n ${{ env.cassandra_namespace }} -f -
              apiVersion: k8ssandra.io/v1alpha1
              kind: K8ssandraCluster
              metadata:
                name: cassandra
              spec:
                cassandra:
                  serverVersion: "4.0.4"
                  datacenters:
                    - metadata:
                        name: dc1
                      size: 1
                      storageConfig:
                        cassandraDataVolumeClaimSpec:
                          storageClassName: standard
                          accessModes:
                            - ReadWriteOnce
                          resources:
                            requests:
                              storage: 5Gi
                      config:
                       jvmOptions:
                           heapSize: 512M
              EOF
              sleep 10
              kubectl rollout status --watch --timeout=600s statefulset/cassandra-dc1-default-sts -n ${{ env.cassandra_namespace }}

      - name: Install required CRDs
        run: |
            kubectl apply -f https://raw.githubusercontent.com/Netcracker/qubership-monitoring-operator/refs/heads/main/charts/qubership-monitoring-crds/crds/grafana.integreatly.org_grafanadashboards.yaml
            kubectl apply -f https://raw.githubusercontent.com/Netcracker/qubership-monitoring-operator/refs/heads/main/charts/qubership-monitoring-crds/crds/monitoring.coreos.com_prometheusrules.yaml
            kubectl apply -f https://raw.githubusercontent.com/Netcracker/qubership-monitoring-operator/refs/heads/main/charts/qubership-monitoring-crds/crds/monitoring.coreos.com_servicemonitors.yaml
            kubectl apply -f https://raw.githubusercontent.com/Netcracker/qubership-monitoring-operator/refs/heads/main/charts/qubership-monitoring-crds/crds/monitoring.coreos.com_podmonitors.yaml


      - name: Install qubership-jaeger
        run: |
            CASSANDRA_USER=$(kubectl get secret -n ${{ env.cassandra_namespace }} cassandra-superuser -o json | jq -r '.data.username' | base64 -d)
            CASSANDRA_PASSWORD=$(kubectl get secret -n ${{ env.cassandra_namespace }} cassandra-superuser -o json | jq -r '.data.password' | base64 -d)
            CASSANDRA_SVC="cassandra-dc1-service.${{ env.cassandra_namespace }}.svc.cluster.local"
            helm upgrade --install qubership-jaeger ./qubership-jaeger/charts/qubership-jaeger --namespace ${{ env.jaeger_namespace}} \
              --create-namespace --set jaeger.prometheusMonitoringDashboard=false --set jaeger.prometheusMonitoring=false \
              --set "cassandraSchemaJob.host=$CASSANDRA_SVC" --set "cassandraSchemaJob.username=$CASSANDRA_USER" \
              --set "cassandraSchemaJob.password=$CASSANDRA_PASSWORD" --set cassandraSchemaJob.datacenter=dc1
            kubectl wait --for=condition=Ready pod --all -n ${{ env.jaeger_namespace }} --timeout=300s

      - name: Install qubership-open-telemetry-collector
        run: |
              helm upgrade --install -n ${{ env.collector_namespace }} --create-namespace qubership-open-telemetry-collector\
                ./qubership-open-telemetry-collector/charts/open-telemetry-collector/ \
                --set JAEGER_COLLECTOR_HOST=jaeger-collector.${{ env.jaeger_namespace }}.svc.cluster.local \
                --set JAEGER_COLLECTOR_OTLP_PORT=4317 \
                --set imageRepository=qubership-open-telemetry-collector \
                --set imageTag=latest
              sleep 20
              echo "============ Pods"
              kubectl get pods -n ${{ env.collector_namespace }}
              echo "============ Configmap"
              kubectl describe configmap opentelemetry-collector-config -n ${{ env.collector_namespace }}
              POD_NAME=$(kubectl get pods --namespace ${{ env.collector_namespace }} -l "app.kubernetes.io/name=qubership-open-telemetry-collector" -o jsonpath="{.items[0].metadata.name}")
              echo "============ Pod $POD_NAME logs"
              kubectl logs "$POD_NAME" -n ${{ env.collector_namespace }}
              kubectl wait --for=condition=Ready pod --all -n ${{ env.collector_namespace }} --timeout=120s

      - name: Run load
        run: |
             OTEL_COLLECTOR_POD_NAME=$(kubectl get pods --namespace ${{ env.collector_namespace }} -l "app.kubernetes.io/name=qubership-open-telemetry-collector" -o jsonpath="{.items[0].metadata.name}")
             echo "============ OTEL collector pod $OTEL_COLLECTOR_POD_NAME"
             echo "============ Start port forwarding"
             kubectl port-forward --namespace ${{ env.collector_namespace }} "$OTEL_COLLECTOR_POD_NAME" 4318:4318 &
             sleep 10
             echo "============ OTEL collector status"
             kubectl get pods -n ${{ env.collector_namespace }}
             echo "============ Jaeger collector status"
             kubectl get pods -n ${{ env.jaeger_namespace }}
             telemetrygen traces --otlp-insecure --otlp-insecure-skip-verify --duration 10s --otlp-endpoint localhost:4318 --child-spans 10 --otlp-http --service testservice --workers 1 --rate 100

      - name: Check traces are coming
        run: |
              echo "============ Jaeger pods"
              kubectl get pods -n ${{ env.jaeger_namespace }}
              echo "============ Jaeger services"
              kubectl get services -n ${{ env.jaeger_namespace }}
              POD_NAME=$(kubectl get pods --namespace ${{ env.jaeger_namespace }} -l "app.kubernetes.io/name=jaeger-query" -o jsonpath="{.items[0].metadata.name}")
              echo "============ Jaeger Query pod $POD_NAME"
              echo "============ Start port forwarding"
              kubectl port-forward --namespace ${{ env.jaeger_namespace }} "$POD_NAME" 8090:16686 &
              sleep 30
              echo "============ Start curl queries"
              curl http://localhost:8090/api/traces?service=testservice | jq '.' | grep testservice
              tracesCount=$(curl http://localhost:8090/api/traces?service=testservice | jq '.' | grep -c testservice)
              echo "============ Traces count: $tracesCount"

              if [[ "$tracesCount" -ge 1 ]]; then
              true
              else
              false
              fi

      - name: Cleanup
        if: always()
        run: |
              if command -v kind >/dev/null 2>&1; then
                kind delete cluster --name ${{ env.kind_name }}
              fi

  integration-gate:
    name: Integration CI Gate
    needs: [changes, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check integration result
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
          SOURCE_CHANGED: ${{ needs.changes.outputs.source }}
          WORKFLOW_CHANGED: ${{ needs.changes.outputs.workflow }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$INTEGRATION_RESULT" = "success"
            exit
          fi

          test "$CHANGE_DETECTION_RESULT" = "success"
          if [ "$SOURCE_CHANGED" = "true" ] || [ "$WORKFLOW_CHANGED" = "true" ]; then
            test "$INTEGRATION_RESULT" = "success"
          else
            test "$INTEGRATION_RESULT" = "skipped"
          fi
