name: Go test with Sonar
on:
  push: {}
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sonar-project-key: ${{ steps.config.outputs.sonar-project-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve sonar project key based on restricted actors
        id: config
        env:
          ACTOR: ${{ github.actor }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          restricted=$(python3 -c "
          import yaml, os
          with open('.github/config/build-config.yaml') as f:
              config = yaml.safe_load(f)
          actors = config.get('restricted-actors', [])
          print('true' if os.environ['ACTOR'] in actors else 'false')
          ")
          if [ "$restricted" = "true" ]; then
            echo "sonar-project-key=" >> "$GITHUB_OUTPUT"
          else
            echo "sonar-project-key=${SONAR_PROJECT_KEY}" >> "$GITHUB_OUTPUT"
          fi

  changes:
    name: Detect collector generation changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      generate: ${{ steps.filter.outputs.generate }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match changed files against collector generation inputs
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed="$(git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}")"
          echo "Changed files:"
          printf '%s\n' "${changed}"

          generate=false
          if [[ -z "${changed}" ]]; then
            generate=true
          else
            while IFS= read -r file; do
              case "${file}" in
                Makefile|builder-config.yaml)
                  generate=true
                  break
                  ;;
                tools/*|collector/*|connector/*|exporter/*|receiver/*|common/*|utils/*)
                  generate=true
                  break
                  ;;
              esac
            done <<< "${changed}"
          fi
          echo "generate=${generate}" >> "${GITHUB_OUTPUT}"

  generate:
    name: Check collector generation
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.generate != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            tools/go.sum
            collector/go.sum
      - name: Regenerate collector and fail on drift
        run: |
          set -euo pipefail
          make install-builder build-collector
          (cd collector && go mod tidy)
          if ! git diff --exit-code -- collector || [[ -n "$(git ls-files --others --exclude-standard -- collector)" ]]; then
            echo "Generated collector is stale. Run:"
            echo "  make install-builder build-collector"
            echo "  (cd collector && go mod tidy)"
            git status --short -- collector
            git diff -- collector
            exit 1
          fi

  test:
    needs: prepare
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    name: Build and test with coverage
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@8a233b03c5b5355d59c1585ffdaa1f45ea816405 # v2.6.1
    with:
      sonar-project-key: ${{ needs.prepare.outputs.sonar-project-key }}
      go-module-configs: >-
        [
          {
            "dir": "collector"
          },
          {
            "dir": "common/graylog"
          },
          {
            "dir": "connector/sentrymetricsconnector"
          },
          {
            "dir": "exporter/graylogexporter"
          },
          {
            "dir": "exporter/logtcpexporter"
          },
          {
            "dir": "receiver/sentryreceiver"
          },
          {
            "dir": "utils"
          }
        ]
      skip-docker: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || 'sonar-disabled' }}
    permissions:
      contents: read
      pull-requests: write
      packages: write

  fork-test:
    needs: prepare
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    name: Build and test fork with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            collector/go.sum
            common/graylog/go.sum
            connector/sentrymetricsconnector/go.sum
            exporter/graylogexporter/go.sum
            exporter/logtcpexporter/go.sum
            receiver/sentryreceiver/go.sum
            utils/go.sum
      - name: Test modules
        run: |
          set -euo pipefail
          modules=(
            collector
            common/graylog
            connector/sentrymetricsconnector
            exporter/graylogexporter
            exporter/logtcpexporter
            receiver/sentryreceiver
            utils
          )
          for dir in "${modules[@]}"; do
            (cd "${dir}" && go test ./...)
          done

  go-ci-gate:
    name: Go CI Gate
    needs: [prepare, changes, generate, test, fork-test]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require Go validation
        if: >-
          needs.prepare.result != 'success' ||
          needs.changes.result != 'success' ||
          (needs.changes.outputs.generate != 'false' && needs.generate.result != 'success') ||
          (github.event.pull_request.head.repo.fork && needs.fork-test.result != 'success') ||
          (!github.event.pull_request.head.repo.fork && needs.test.result != 'success')
        run: exit 1
